<div class="bg-blue-200">

    <!-- Top Info Bar -->
    <div class="bg-black text-sm text-gray-600 border-b border-gray-200">
      <div class="container mx-auto flex justify-between items-center py-2 px-4">
        <div class="flex space-x-6">
          <div class="flex items-center space-x-2">
            <i class="fas fa-envelope text-orange-500"></i>
            <span>info@nightniche9.com</span>
          </div>
          <div class="flex items-center space-x-2">
            <i class="fas fa-map-marker-alt text-orange-500"></i>
            <span>Sunny Isles Beach, FL 33160</span>
          </div>
        </div>
        <div class="space-x-4 hidden sm:flex">
          <i class="fab fa-facebook-f hover:text-orange-500"></i>
          <i class="fab fa-twitter hover:text-orange-500"></i>
          <i class="fab fa-instagram hover:text-orange-500"></i>
          <i class="fab fa-linkedin-in hover:text-orange-500"></i>
        </div>
      </div>
    </div>
  
    <!-- Main Navbar -->
    <nav class="bg-blue shadow-sm">
      <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <!-- Logo -->
        <div class="text-2xl font-bold text-gray-800">🌃Night Niche</div>
  
        <!-- Nav Links -->
        <ul class="hidden md:flex space-x-5 text-gray-600 font-medium">
          <li><a href="#" class="hover:text-blue-700 font-semibold">Home</a></li>
          <li><a href="#" class="hover:text-blue-700">Hotels</a></li>
          <li><a href="#" class="hover:text-blue-700">Balance</a></li>
          <li><a href="#" class="hover:text-blue-700">Contact Us</a></li>
          <li><a href="{% url 'types-list' %}" class="hover:text-blue-700">Add Room Types</a></li>
        </ul>
  
        <!-- CTA Button -->
        <div>
          {% if request.user.is_authenticated %}
            <div class="flex">
              <a href="#" class="bg-black text-white  items-center px-4 py-2 mr-3 rounded-full hover:bg-gray-900">
                <i class="fas fa-calendar-alt  text-orange-500"></i>
                Schedule a visit
              </a>
              <form  method='post' action="{% url 'logout' %}">
                {% csrf_token %}
                <button type='submit' class="bg-black text-white  items-center px-4 py-2 rounded-full hover:bg-gray-900 fas fa-calendar-alt  text-orange-500">Logout</button>
              </form>
            </div>
          {% else %}
            <a href="{% url 'login' %}" class="bg-black text-white  items-center px-4 py-2 mr-3 rounded-full hover:bg-gray-900">
              <i class="fas fa-calendar-alt  text-orange-500"></i>
              Login
            </a>
            <a href="{% url 'register' %}" class="bg-black text-white  items-center px-4 py-2 rounded-full hover:bg-gray-900">
              <i class="fas fa-calendar-alt  text-orange-500"></i>
              Register
            </a>
          {% endif %}   
        </div>
      </div>
    </nav>
  
  </div>
